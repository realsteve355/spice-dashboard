<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Automation cost forecasts — what the bulls actually predict</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Forecasts page uses a single full-width column instead of the controls + results split */
  main.forecasts {
    display: block;
    padding: 24px 32px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .quote-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .quote {
    background: var(--panel);
    border: 1px solid var(--line-hot);
    border-left: 3px solid var(--ok);
    padding: 14px 18px;
  }
  .quote .body {
    font-size: 13px;
    color: var(--txt);
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .quote .attrib {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .quote .attrib a { color: var(--dim); }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 14px;
  }
  .cat-card {
    background: var(--panel);
    border: 1px solid var(--line-hot);
    padding: 12px 16px;
    font-size: 12px;
  }
  .cat-card.crit { border-left: 3px solid var(--crit); }
  .cat-card.warn { border-left: 3px solid var(--warn); }
  .cat-card.ok   { border-left: 3px solid var(--ok); }
  .cat-card.blue { border-left: 3px solid var(--blue); }
  .cat-card .cat-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .cat-card .cat-name {
    font-size: 13px;
    color: var(--headline);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .cat-card .cat-mech {
    font-size: 11px;
    color: var(--dim);
    line-height: 1.45;
    margin-bottom: 8px;
  }
  .cat-card table { font-size: 11px; }
  .cat-card .cat-anchors {
    font-size: 10px;
    color: var(--faint);
    margin-top: 6px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<header>
  <h1>Automation cost forecasts — what the bulls actually predict</h1>
  <div class="subtitle">
    Six independent voices on cost trajectories 2026 → 2045 ·
    <a href="/" style="color: var(--dim);">← single-month diagnostic</a> ·
    <a href="/trajectory" style="color: var(--dim);">trajectory simulator →</a> ·
    <a href="/references" style="color: var(--dim);">deep references →</a>
  </div>
</header>

<main class="forecasts" id="results">
  <div class="empty" style="padding:80px; text-align:center; color:var(--faint);">Loading…</div>
</main>

<script src="/static/forecasts.js"></script>
</body>
</html>
