name: _staging-deploy (reusable)

# Mirrors the axion repo's staging pipeline (.github/workflows/_staging-deploy.yml
# there) so this marketing site gets the same axion-tech.xyz staging environment
# the other six services already have. Builds + deploys via the Vercel CLI (not
# Vercel's own git integration, so we control exactly which deployment the staging
# domain aliases to), then points axion-tech.xyz at the result.

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      domain:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_YBynSUEYhMQlK9lUtL1OdfBV
      VERCEL_PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g vercel@latest

      - name: Pull Vercel project settings (preview env)
        run: vercel pull --yes --environment=preview --git-branch=${{ github.ref_name }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Alias to staging domain
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ inputs.domain }}" --token=${{ secrets.VERCEL_TOKEN }}
