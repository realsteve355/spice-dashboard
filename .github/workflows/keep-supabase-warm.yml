name: Keep Supabase warm

# Free-tier Supabase pauses a project after 7 days with no database activity.
# This job does a lightweight authenticated read three times a week, which
# counts as DB activity and resets that timer — so the legacy colony-app's
# off-chain features (announcements, notifications, activity feed, budget
# history, mall listings) stay live without anyone opening the app.
#
# Requires one repository secret:
#   SUPABASE_ANON_KEY  — Supabase dashboard → Project Settings → API →
#                        Project API keys → "anon public"
# The project URL is not secret (it already ships in the frontend bundle),
# so it is inlined below.

on:
  schedule:
    - cron: '0 12 * * 1,3,5'   # Mon, Wed, Fri at 12:00 UTC (max gap ~3 days, well under 7)
  workflow_dispatch: {}         # manual "Run workflow" button, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row (keeps the database warm)
        env:
          SUPABASE_URL: https://jhzbxiolczviwremgalv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/activity_log?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded HTTP $code"
          case "$code" in
            2*) echo "OK - project is awake." ;;
            *)  echo "Unexpected status $code (is SUPABASE_ANON_KEY set?)" >&2; exit 1 ;;
          esac
