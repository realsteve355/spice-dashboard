<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Companies doing business in Midwestville County — the MAC base</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  main.cos { display: block; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .cos .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .cos .stat { background: var(--panel); border: 1px solid var(--line-hot); padding: 12px 16px; }
  .cos .stat .label { font-size: 10px; color: var(--dim); letter-spacing: 0.15em; text-transform: uppercase; }
  .cos .stat .value { font-size: 22px; color: var(--headline); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .cos .stat .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .cos table { font-size: 12px; width: 100%; }
  .cos td.bar { position: relative; }
  .cos .examples { color: var(--dim); font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Companies doing business in Midwestville County</h1>
  <div class="subtitle">
    How much business is done, and the revenue captured per company · the base the Market Access Charge is built on · today (2026)
  </div>
</header>

<main class="cos" id="results">
  <div class="empty" style="padding:80px; text-align:center; color:var(--faint);">Loading…</div>
</main>

<script src="/static/nav.js"></script>
<script src="/static/companies.js"></script>
</body>
</html>
