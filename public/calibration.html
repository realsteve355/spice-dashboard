<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calibrating k — funding the UBI, and what the company keeps</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  main.mac { display: block; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .mac .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .mac .stat { background: var(--panel); border: 1px solid var(--line-hot); padding: 12px 16px; }
  .mac .stat .label { font-size: 10px; color: var(--dim); letter-spacing: 0.15em; text-transform: uppercase; }
  .mac .stat .value { font-size: 22px; color: var(--headline); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .mac .stat .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .mac table { font-size: 12px; width: 100%; }
  .mac .formula { background: var(--panel2); border: 1px solid var(--line-hot); padding: 12px 16px; margin-top: 12px; font-size: 13px; color: var(--txt); line-height: 1.6; }
  .mac .formula code { color: var(--ok); }
</style>
</head>
<body>

<header>
  <h1>Calibrating k — funding the UBI, and what the company keeps</h1>
  <div class="subtitle">
    Set k so the MAC equals the required UBI · then read off the profit left with the firms
  </div>
</header>

<main class="mac" id="results">
  <div class="empty" style="padding:80px; text-align:center; color:var(--faint);">Loading…</div>
</main>

</body>
</html>
